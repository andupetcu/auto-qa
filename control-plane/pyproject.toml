[project]
name = "auto-qa-control-plane"
version = "0.2.0"
description = "Auto QA control plane (FastAPI + SQLite + local artifacts, no Temporal/Docker)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-ulid>=2.7",
    "mcp>=1.9",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "croniter>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
