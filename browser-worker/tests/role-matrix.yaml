# Route × role expectations (arch §3.3), SPA semantics:
#   render   — app shell visible, no auth gate
#   redirect — client-side auth gate shown (gate text / login form / ?auth=login)
#   403      — forbidden marker (reserved, unused in v0.1)
/:                            { user: render, anon: render }
/dashboard/analytics:         { user: render, anon: redirect }
/dashboard/reports:           { user: render, anon: redirect }
/admin/users:                 { user: render, anon: redirect }
